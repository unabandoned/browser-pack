name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@8209b3759f567166a64a0e5e3a26652b154ed360 # v1.0.2
    with:
      install-for-publish: false
    secrets: inherit

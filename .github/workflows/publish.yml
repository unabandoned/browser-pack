name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@5389d699374234e7a2c9f5ca6101c6e53168c796 # v1.0.4
    with:
      install-for-publish: false
    secrets: inherit

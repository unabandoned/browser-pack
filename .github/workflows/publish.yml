name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@d493a18373453d0e55c5e9952d472f59763f3da2 # v1.0.0
    with:
      install-for-publish: false
    secrets: inherit

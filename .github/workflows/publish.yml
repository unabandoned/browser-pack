name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@b7d15f415eb7e6475523b40d929e8a7a0d90a82f # v1.0.3
    with:
      install-for-publish: false
    secrets: inherit

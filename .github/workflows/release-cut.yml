name: release-cut
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    permissions:
      contents: write
      pull-requests: write
    uses: unabandoned/.github/.github/workflows/reusable-release-cut.yml@0c6624ebbfd7e7f93a448163c241111768d86541 # v1.0.5
    secrets: inherit

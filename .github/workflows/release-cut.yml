name: release-cut
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    permissions:
      contents: write
      pull-requests: write
    uses: unabandoned/.github/.github/workflows/reusable-release-cut.yml@8209b3759f567166a64a0e5e3a26652b154ed360 # v1.0.2
    secrets: inherit

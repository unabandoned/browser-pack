name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
      contents: read
